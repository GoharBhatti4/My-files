<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BoltConvert is an online file converter offering secure, lightning-fast file conversions for various formats.">
    <meta name="keywords" content="file converter, online converter, PDF to DOC, MP4 to MP3, file format conversion, BoltConvert">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta property="og:title" content="BoltConvert - Online File Converter">
    <meta property="og:description" content="Secure and fast file conversions for multiple formats.">
    <meta property="og:image" content="https://boltconvert.com/og-image.jpg">
    <meta property="og:url" content="https://boltconvert.com">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://boltconvert.com">
    <title>BoltConvert.online</title>
    <link rel="icon" href="https://boltconvert.com/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #232634 60%);
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 20px 0;
            background-color: #232634;
            color: #4dd0e1;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 6px rgba(255, 255, 255, 0.5);
            animation: slideIn 1s ease-in-out;
            display: inline-block;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-100%);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .domain {
            font-size: 0.7rem;
            position: absolute;
            top: 100%;
            right: 0;
            transform: translateY(-50%);
            display: block;
            
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 30px;
            background-color: #e6e6e6;
            border-radius: 15px;
            text-align: center;
             box-shadow: 0px 8px 16px rgba(0, 0, 0, 0);
            margin-top: 20px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        p {
            color: #333;
            margin-bottom: 20px;
        }

       .file-dropzone {
  border: 2px dashed #4dd0e1;
  padding: 30px;
  border-radius: 10px;
  margin-bottom: 20px;
  background-color: rgba(255, 255, 255, 0.5);
  cursor: pointer;
  transition: background-color 0.3s ease, border-color 0.3s ease;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Glow effect for the file drop zone */
@keyframes pulse {
    0% {
        box-shadow: 0 0 10px rgba(77, 208, 225, 0.6), 0 0 20px rgba(77, 208, 225, 0.4), 0 0 30px rgba(77, 208, 225, 0.2);
    }
    50% {
        box-shadow: 0 0 20px rgba(77, 208, 225, 1), 0 0 30px rgba(77, 208, 225, 0.6), 0 0 40px rgba(77, 208, 225, 0.4);
    }
    100% {
        box-shadow: 0 0 10px rgba(77, 208, 225, 0.6), 0 0 20px rgba(77, 208, 225, 0.4), 0 0 30px rgba(77, 208, 225, 0.2);
    }
}

.file-dropzone {
    border: 2px dashed #4dd0e1;
    padding: 30px;
    border-radius: 10px;
    margin-bottom: 20px;
    background-color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    transition: background-color 0.3s ease, border-color 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: pulse 1.5s infinite; /* Add the pulsing effect */
}


        .file-dropzone p {
            font-size: 1.2rem;
            color: #4dd0e1;
        }

        input[type="file"] {
            display: none;
        }

        .convert-section {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }
        
        .convert-options {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 15px;
        }
        
       .convert-options select {
    padding: 10px;
    border: 2px solid #4dd0e1;
    border-radius: 8px;
    font-size: 1rem;
    width: 150px;
    background-color: #232634;
    color: #f0f0f0;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

.convert-options select:hover {
    border-color: #ff9800;
    background-color: #333;
    
}

.convert-options select:focus {
    outline: none;
    box-shadow: 0 0 10px #4dd0e1, 0 0 20px rgba(77, 208, 225, 0.5);
}

        .convert-btn {
            background-color: #4dd0e1;
            color: #232634;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            display: none;
            animation: fadeIn 1s ease-in-out;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
           
            }
            
            @keyframes fadeIn {
              from {
                opacity: 0;
                transform: scale(0.9);
              }
            
              to {
                opacity: 1;
                transform: scale(1);
              }
            }
        

        .convert-btn:hover {
            background-color: #ff9800;
            transform: translateY(-5px) scale(1.05);
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #eaeaea;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .progress {
            width: 0;
            height: 100%;
            background-color: #4dd0e1;
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        /* New section to display file information */
        #file-info {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #333;
        }

        /* Style for the file type */
        .file-type {
            color: #4dd0e1;
            font-weight: bold;
        }

        /* New Layout for post-conversion */
        .new-layout {
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        
          
        }

        .new-layout button {
            background-color: #4dd0e1;
            color: #232634;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin: 10px;
            transition: background-color 1.3s ease;
            
        }

        .new-layout button:hover {
            background-color: #ff9800;
        }
       

          .convert-options select {
    transition: transform 0.2s ease-in-out, background-color 0.2s ease-in-out;
}

.convert-options select:focus {
    transform: scale(1.05);
    background-color: #333;
}

        
        
    </style>
</head>

<body>
    <header>
        <h1>BoltConvert⚡<span class="domain">.online</span></h1>
    </header>

    <div class="container">
        <p>Convert Simple, fast, and secure!</p>

        <div class="file-dropzone" id="dropzone">
          <p>Drag and drop your file here or click to upload</p>
          <input type="file" id="file-input">
        </div>


        <div class="convert-section">
            <div class="convert-options">
                <select id="file-format">
                    <option value="">Select format</option>
                    <option value="pdf">PDF</option>
                    <option value="doc">DOC</option>
                    <option value="mp3">MP3</option>
                    <option value="mp4">MP4</option>
                </select>
            </div>





            <button class="convert-btn" id="convert-btn">Convert⚡</button>
        </div>

        <div class="progress-bar" id="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        
        
        
        <!-- Display file name and type -->
        <div id="file-info"></div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileFormat = document.getElementById('file-format');
        const convertBtn = document.getElementById('convert-btn');
        const progressBar = document.getElementById('progress-bar');
        const progress = document.getElementById('progress');
        const fileInfo = document.getElementById('file-info');
        const container = document.querySelector('.container');

        document.getElementById('dropzone').addEventListener('click', function () {
            fileInput.click();
        });

        fileInput.addEventListener('change', displayFileInfo);
        fileInput.addEventListener('change', checkFileAndFormat);
        fileFormat.addEventListener('change', checkFileAndFormat);

        function displayFileInfo(event) {
    const file = event.target.files[0];
    if (file) {
        const fullFileName = file.name;
        const maxLength = window.innerWidth < 768 ? 15 : 25;
        const truncatedFileName = fullFileName.length > maxLength ? fullFileName.substring(0, maxLength) + '...' : fullFileName;

        // Get the file extension
        const fileExtension = fullFileName.split('.').pop().toLowerCase();

        // Display the file name and extension
        fileInfo.innerHTML = `
            <span class="truncated-file-name" data-full-name="${fullFileName}">${truncatedFileName}</span>
            <span class="file-type">${fileExtension}</span>`;
    } else {
        fileInfo.textContent = '';
    }
}

        
        function checkFileAndFormat() {
          const file = fileInput.files[0];
          const format = fileFormat.value;
        
          if (file && format) {
            convertBtn.style.display = 'block';
          } else {
            convertBtn.style.display = 'none';
          }
        }

        convertBtn.addEventListener('click', handleConvert);

        function handleConvert() {
            const file = fileInput.files[0];
            const format = fileFormat.value;

            if (!file) {
                alert('Please select a file to convert.');
                return;
            }

            progressBar.style.display = 'block';

            simulateFileConversion(file, format);
        }

        function simulateFileConversion(file, format) {
            let progressValue = 0;
            const interval = setInterval(() => {
                progressValue += 10;
                progress.style.width = `${progressValue}%`;

                if (progressValue >= 100) {
                    clearInterval(interval);
                    progressBar.style.display = 'none';
                    updateLayoutForDownload();
                }
            }, 500);
        }

        function updateLayoutForDownload() {
    container.innerHTML = `
        <div class="new-layout">
            <h2 style="color: #ff9800;">Conversion Complete!</h2> <!-- Change text color here -->
            <button onclick="downloadFile()">Download File</button>
            <button onclick="startNewConversion()">Convert Another File</button>
        </div>
    `;
}


        function downloadFile() {
            alert('Downloading file...');
        }

        function startNewConversion() {
            location.reload();
        }
        
        
        
        
        fileInput.addEventListener('change', displayFileInfo);
fileInput.addEventListener('change', checkFileAndFormat);
fileInput.addEventListener('change', toggleGlowEffect); // Add this line
fileFormat.addEventListener('change', checkFileAndFormat);

function toggleGlowEffect() {
    const file = fileInput.files[0];
    const dropzone = document.getElementById('dropzone');

    if (file) {
        dropzone.classList.remove('glowing'); // Remove glowing effect when a file is uploaded
    } else {
        dropzone.classList.add('glowing'); // Add glowing effect when no file is uploaded
    }
}



function toggleGlowEffect() {
    const file = fileInput.files[0];
    const dropzone = document.getElementById('dropzone');

    if (file) {
        dropzone.style.animation = 'none'; // Remove the pulsing effect when a file is uploaded
        dropzone.classList.remove('glowing'); // Ensure class is removed
    } else {
        dropzone.style.animation = 'pulse 1.5s infinite'; // Add the pulsing effect when no file is uploaded
        dropzone.classList.add('glowing'); // Ensure class is added
    }
}



    </script>
</body>

</html>
